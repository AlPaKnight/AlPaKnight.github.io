<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocole Détox & Liberté</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div>
    <a href="#home" data-fr="Accueil" data-en="Home">Accueil</a>
    <a href="#histoire" data-fr="Mon histoire" data-en="My story">Mon histoire</a>
    <a href="#contact" data-fr="Contact" data-en="Contact">Contact</a>
  </div>

  <div class="controls">
    <button id="themeToggle">🌙</button>

    <div class="lang-toggle">
      <button data-lang="fr" class="active">FR</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</nav>

<section id="home">
  <h1 data-fr="Bienvenue" data-en="Welcome">Bienvenue</h1>
  <p data-fr="Un espace de transformation." data-en="A space for transformation.">
    Un espace de transformation.
  </p>
  
  <div class="cta-container">
    <a href="https://gumroad.com/?gad_source=1&gad_campaignid=23640098586&gbraid=0AAAABDCxIfgPSpwoScrHzUkKFQmRx6l4e" 
       target="_blank" 
       class="btn-gumroad" 
       data-fr="Obtenir l'ebook →" 
       data-en="Get the ebook →">
       Obtenir l'ebook →
    </a>
  </div>
</section>

<section id="histoire">
  <h2 data-fr="Mon histoire" data-en="My Story">Mon histoire</h2>
  <p data-fr="Voici mon parcours..." data-en="Here is my journey...">
    Voici mon parcours...
  </p>
</section>

<section id="contact">
  <h2 data-fr="Contact" data-en="Contact">Contact</h2>
  <p data-fr="Tu peux me contacter ici." data-en="You can contact me here.">
    Tu peux me contacter ici.
  </p>
</section>

<script>
/* =========================
   GESTION DU THEME (DARK / LIGHT)
========================= */
const toggle = document.getElementById('themeToggle');

toggle.onclick = () => {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';

  if (isDark) {
    html.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  } else {
    html.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  }
};

// Restauration automatique du thème au chargement
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
}

/* =========================
   GESTION DE LA LANGUE (FR / EN)
========================= */
const buttons = document.querySelectorAll('[data-lang]');

buttons.forEach(btn => {
  btn.onclick = () => {
    const lang = btn.dataset.lang;

    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Traduit instantanément tous les éléments dotés d'attributs de traduction
    document.querySelectorAll('[data-fr]').forEach(el => {
      el.textContent = el.dataset[lang];
    });

    localStorage.setItem('lang', lang);
  };
});

// Restauration automatique de la langue au chargement
const savedLang = localStorage.getItem('lang') || 'fr';
document.querySelector(`[data-lang="${savedLang}"]`).click();
</script>

</body>
</html>
